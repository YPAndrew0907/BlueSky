[project]
name = "bsky-fair-collect"
version = "0.1.0"
description = "Read-only, resumable data collection pipeline for fairness measurement in Bluesky’s open feed ecosystem."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
bsky-fair-collect = "bsky_fair_collect.__main__:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

